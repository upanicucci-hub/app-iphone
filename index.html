<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <!-- Fa sì che la pagina si adatti alla larghezza dello schermo dell'iPhone.
       viewport-fit=cover usa anche lo spazio vicino alla "tacca" in alto. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Quando la aggiungi alla schermata Home, si apre a tutto schermo come un'app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Offerte PC AI">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Offerte PC AI</title>
  <!-- L'aspetto grafico sta in un file a parte -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Offerte PC AI</h1>
    <p class="sottotitolo">I 3 migliori portatili Copilot+ del momento</p>
  </header>

  <main>
    <!-- Riquadro 1: la chiave API (lo completiamo nel pezzo 2) -->
    <section class="riquadro">
      <h2>Chiave API</h2>
      <p id="stato-chiave" class="nota">Non ancora impostata.</p>
    </section>

    <!-- Riquadro 2: i criteri decisi al punto 3, solo da leggere -->
    <section class="riquadro">
      <h2>Cosa cerco</h2>
      <ul class="criteri">
        <li>Portatili Copilot+ PC (chip AI / NPU)</li>
        <li>Almeno 32 GB di RAM e 1 TB di SSD</li>
        <li>Fino a 3.000 €, IVA inclusa</li>
        <li>Negozi online italiani</li>
      </ul>
    </section>

    <!-- Il pulsante di ricerca: per ora spento, lo accendiamo nel pezzo 3 -->
    <button id="cerca" disabled>Cerca offerte</button>
    <p id="messaggio" class="nota centrato"></p>

    <!-- Qui compariranno le 3 schede con le offerte (pezzo 4) -->
    <section id="risultati"></section>
  </main>

  <!-- Il programma sta in un file a parte, caricato per ultimo -->
  <script src="app.js"></script>
</body>
</html>
